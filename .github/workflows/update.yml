name: Sync & Format AGH YouTube Lists

on:
  schedule:
    # Runs automatically once every 12 hours (UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  update-lists:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and format lists
        run: |
          # 1. Process youtubelist.txt -> youtubelist_agh.txt
          curl -sSL "https://raw.githubusercontent.com/kboghdady/youTube_ads_4_pi-hole/refs/heads/master/youtubelist.txt" -o raw_youtube.txt
          sed -E '/^[[:blank:]]*(#|$)/d; s/^[[:blank:]]*//; s/[[:blank:]]*$//; s/^/||/; s/$/^/' raw_youtube.txt | sort -u > youtubelist_agh.txt
          rm raw_youtube.txt

          # 2. Process crowed_list.txt -> crowed_list_agh.txt
          curl -sSL "https://raw.githubusercontent.com/kboghdady/youTube_ads_4_pi-hole/refs/heads/master/crowed_list.txt" -o raw_crowed.txt
          sed -E '/^[[:blank:]]*(#|$)/d; s/^[[:blank:]]*//; s/[[:blank:]]*$//; s/^/||/; s/$/^/' raw_crowed.txt | sort -u > crowed_list_agh.txt
          rm raw_crowed.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtubelist_agh.txt crowed_list_agh.txt
          if git diff --staged --quiet; then
            echo "No changes found. Skipping commit."
          else
            git commit -m "Auto-update: Sync YouTube blocklists"
            git push
          fi
